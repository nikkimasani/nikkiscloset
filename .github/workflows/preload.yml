name: preload wardrobe
# Makes the preloaded wardrobe (scripts/preload.mjs) with the Cloudflare keys kept in this repository's secrets, and opens a pull request
# with the pieces and contact sheets (review/) to check before they go live. Start it from Actions > preload wardrobe > Run workflow.
# It also runs every day at 00:40 UTC (just after Cloudflare's free allowance resets) until every piece is made, then does nothing.
on:
  workflow_dispatch:
    inputs:
      redo:
        description: 'Pieces to make again (ids, comma-separated, or "worn" for every piece drawn on the model; empty = make what is missing)'
        required: false
        default: ''
      reextract:
        description: 'Only cut the pieces out again from the drawings already made (no Cloudflare, no neurons)'
        type: boolean
        default: false
  schedule:
    - cron: '40 0 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency: { group: preload-wardrobe, cancel-in-progress: false }
jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Carry on from the wardrobe branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin preload-wardrobe; then
            git checkout -B preload-wardrobe origin/preload-wardrobe
            if ! git merge --no-edit origin/main; then
              # contact sheets are made again every run: main's do
              git checkout origin/main -- review && git add review
              # the piece list changed on both sides (new pieces here, pieces taken out or an app fix on main): join the two (scripts/merge-index.mjs),
              # and settle clashing pictures the same way, so a clash never throws pieces away
              IDX=public/starter/made/index.json
              if git diff --name-only --diff-filter=U | grep -qx "$IDX"; then
                git show ":1:$IDX" > "$RUNNER_TEMP/base.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base.json"
                git show ":2:$IDX" > "$RUNNER_TEMP/ours.json"; git show ":3:$IDX" > "$RUNNER_TEMP/theirs.json"
                node scripts/merge-index.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/ours.json" "$RUNNER_TEMP/theirs.json" > "$IDX" 2> "$RUNNER_TEMP/sides.txt" && git add "$IDX"
                for f in $(git diff --name-only --diff-filter=U | grep '^public/starter/made/.*\.webp$' || true); do
                  s=$(grep " $(basename "$f" .webp)\$" "$RUNNER_TEMP/sides.txt" | cut -d' ' -f1)
                  if [ "$s" = ours ] || [ "$s" = theirs ]; then { git checkout "--$s" -- "$f" 2>/dev/null && git add "$f"; } || git rm -q -- "$f"; else git rm -q -- "$f"; fi
                done
              fi
              # anything else that still clashes means starting fresh from main
              if git diff --name-only --diff-filter=U | grep -q .; then git merge --abort; git checkout -B preload-wardrobe origin/main; echo '::notice::The wardrobe branch clashed with main, so this run starts fresh from main.'; else git commit --no-edit; fi
            fi
          else git checkout -b preload-wardrobe; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # (it once hung for over an hour; it normally takes under a minute)
      - name: Make the pieces
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          REDO: ${{ github.event.inputs.redo }}
          REEXTRACT: ${{ github.event.inputs.reextract }}
        run: node scripts/preload.mjs ${REDO:+--redo "$REDO"} $([ "$REEXTRACT" = true ] && echo --reextract)
      - name: Save them and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/starter/made review $(ls starter-raw/*.jpg >/dev/null 2>&1 && echo starter-raw)
          if git diff --cached --quiet; then echo 'Nothing new.'; exit 0; fi
          git commit -m "Preloaded wardrobe: $(head -1 review/summary.txt)"
          if ! git push origin preload-wardrobe; then # (the branch was started fresh from main above and the old one can't be overwritten): keep the pieces on their own branch
            B="preload-wardrobe-${{ github.run_id }}"; git push origin "HEAD:refs/heads/$B"
            echo "::warning::This run's pieces are on the $B branch (the wardrobe branch had pieces of its own that aren't in main yet)."
            gh pr create --base main --head "$B" --draft --title 'Preloaded wardrobe (separate branch)' --body "Pieces made by the preload wardrobe workflow, kept on their own branch because preload-wardrobe has pieces that aren't in main yet. Contact sheets are in review/." || true
            exit 0
          fi
          gh pr view preload-wardrobe --json state -q .state 2>/dev/null | grep -q OPEN || gh pr create --base main --head preload-wardrobe --draft \
            --title 'Preloaded wardrobe' --body 'Pieces made by the preload wardrobe workflow. Contact sheets are in review/ (one per category); failed pieces and why are in review/summary.txt. Check them before merging.' \
            || echo "::notice::Pieces saved on the preload-wardrobe branch (open the pull request from there): https://github.com/${{ github.repository }}/compare/main...preload-wardrobe"
