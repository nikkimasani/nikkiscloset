<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nikki's Closet</title>
  <meta name="description" content="A digital closet: try on your real clothes, plan your OOTD, and match inspo to what you own.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👗%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Nikki's <em>Closet</em></h1>
    <nav id="nav" aria-label="Sections">
      <button data-view="closet" class="on">Closet</button>
      <button data-view="tryon">Try On</button>
      <button data-view="planner">OOTD Log</button>
      <button data-view="inspo">Inspo</button>
    </nav>
    <button class="primary" data-act="add">+ Add piece</button>
  </header>
  <main id="main"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
