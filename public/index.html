<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1ea">
  <title>Vesti</title>
  <meta name="description" content="Vesti, your digital stylist: a look for every day from your own wardrobe, for the weather and your plans — try it on, plan your week, match your inspo.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vesti">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <h1 class="brand">Vesti</h1>
    <button class="primary" data-act="add">Add piece</button>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Main">
    <button data-view="today" class="on" aria-current="page"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></span>Today</button>
    <button data-view="tryon"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7.5a2 2 0 1 1 2-2c0 1-.8 1.4-2 2.2v1.3"/><path d="M12 9 3 15.5c-.6.5-.3 1.5.5 1.5h17c.8 0 1.1-1 .5-1.5L12 9Z"/></svg></span>Try On</button>
    <button data-view="closet"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="1"/><path d="M12 3v18M10 11.5v1.5M14 11.5v1.5M4.5 18h15"/></svg></span>Wardrobe</button>
    <button data-view="plan"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg></span>Plan</button>
    <button data-view="inspo"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h10v17l-5-3.6-5 3.6z"/></svg></span>Inspo</button>
  </nav>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
